<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>导航测试</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <h2>导航测试页面</h2>
        <p>这个页面用于测试任务报告页面的返回功能</p>

        <div class="mt-4">
            <h3>测试链接</h3>
            <ul>
                <li><a href="http://localhost:8081/tasks/3873e11e-6af0-4cd8-b35c-d9bd58783d1a/report" target="_self">在同一标签页打开任务报告</a></li>
                <li><a href="http://localhost:8081/tasks/3873e11e-6af0-4cd8-b35c-d9bd58783d1a/report" target="_blank">在新标签页打开任务报告</a></li>
            </ul>
        </div>

        <div class="mt-4">
            <h3>测试说明</h3>
            <ol>
                <li>点击"在同一标签页打开任务报告" - 返回按钮应该能正常返回到此页面</li>
                <li>点击"在新标签页打开任务报告" - 返回按钮应该返回到主页</li>
                <li>在任务报告页面按ESC键 - 应该触发返回功能</li>
                <li>在移动设备上右滑 - 应该触发返回功能</li>
            </ol>
        </div>
    </div>
</body>
</html>
