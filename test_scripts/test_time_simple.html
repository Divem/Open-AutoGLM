<!DOCTYPE html>
<html>
<head>
    <title>时间格式化测试</title>
    <meta charset="UTF-8">
</head>
<body>
    <h1>时间格式化功能测试</h1>
    <div id="test-results"></div>

    <script>
        // 简化的时间格式化函数测试
        function formatDateTime(timestamp) {
            if (!timestamp) return '时间未知';

            try {
                let date = new Date(timestamp);
                if (isNaN(date.getTime())) return '时间格式错误';

                const offset = date.getTimezoneOffset();
                const absOffset = Math.abs(offset);
                const hours = Math.floor(absOffset / 60);
                const minutes = absOffset % 60;
                const sign = offset <= 0 ? '+' : '-';

                return `${date.getFullYear()}-${(date.getMonth() + 1).toString().padStart(2, '0')}-${date.getDate().toString().padStart(2, '0')} ${date.getHours().toString().padStart(2, '0')}:${date.getMinutes().toString().padStart(2, '0')}:${date.getSeconds().toString().padStart(2, '0')} (UTC${sign}${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')})`;
            } catch (error) {
                return '时间格式错误';
            }
        }

        function formatRelativeTime(timestamp) {
            if (!timestamp) return '时间未知';

            try {
                let date = new Date(timestamp);
                if (isNaN(date.getTime())) return '时间格式错误';

                const now = new Date();
                const diffMs = now - date;
                const diffSeconds = Math.floor(diffMs / 1000);
                const diffMinutes = Math.floor(diffSeconds / 60);
                const diffHours = Math.floor(diffMinutes / 60);
                const diffDays = Math.floor(diffHours / 24);

                if (diffSeconds < 60) {
                    return diffSeconds <= 0 ? '刚刚' : `${diffSeconds}秒前`;
                } else if (diffMinutes < 60) {
                    return `${diffMinutes}分钟前`;
                } else if (diffHours < 24) {
                    return `${diffHours}小时前`;
                } else if (diffDays < 7) {
                    return `${diffDays}天前`;
                } else {
                    return formatDateTime(timestamp);
                }
            } catch (error) {
                return '时间格式错误';
            }
        }

        // 测试用例
        const testCases = [
            '2024-12-15T14:30:00Z',
            '2024-12-15 14:30:00',
            '1703326200000',
            '2024-12-17T12:00:00Z', // 今天
            'invalid-date',
            null,
            ''
        ];

        let results = '<h2>测试结果:</h2>';

        testCases.forEach((testCase, index) => {
            results += `<h3>测试用例 ${index + 1}: ${testCase || '空值'}</h3>`;
            results += `<p><strong>标准日期:</strong> ${new Date(testCase).toString()}</p>`;
            results += `<p><strong>formatDateTime:</strong> ${formatDateTime(testCase)}</p>`;
            results += `<p><strong>formatRelativeTime:</strong> ${formatRelativeTime(testCase)}</p>`;
            results += '<hr>';
        });

        // 测试时区显示
        results += '<h2>时区显示测试:</h2>';
        const now = new Date();
        results += `<p><strong>当前时间:</strong> ${now.toString()}</p>`;
        results += `<p><strong>本地时间格式:</strong> ${formatDateTime(now.toISOString())}</p>`;
        results += `<p><strong>UTC时间:</strong> ${now.toISOString()}</p>`;
        results += `<p><strong>时区偏移:</strong> ${now.getTimezoneOffset()} 分钟</p>`;

        document.getElementById('test-results').innerHTML = results;
    </script>
</body>
</html>
